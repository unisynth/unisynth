# Cross-link Windows PE from macOS/Linux with rust-lld; raw-dylib means no SDK import libs needed.
# Linker flag variants are driven by ./measure.sh via RUSTFLAGS.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld"

[target.i686-pc-windows-msvc]
linker = "rust-lld"

[unstable]
build-std = ["core", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem", "optimize_for_size"]
