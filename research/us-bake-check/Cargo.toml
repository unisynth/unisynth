# Bit-exactness check of baked songs (shrink-unified-synth 4.4): host binary, never part of the root workspace.
[workspace]
[package]
name = "us-bake-check"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
synth-core = { path = "../../crates/synth-core" }
unisynth = { path = "../../crates/unisynth", default-features = false }

[build-dependencies]
synth-convert = { path = "../../crates/synth-convert" }

[features]
# the song as Rust (`synth-convert rust`) with `us-trusted` (no chunk validation, no module load checks)
baked = ["unisynth/us-trusted"]
