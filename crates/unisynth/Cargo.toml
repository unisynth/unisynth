[package]
name = "unisynth"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "no_std unified synth: one slot-based instrument and one merged effect set (MIT; WaveSabre-derived code keeps its notice, see LICENSE-WaveSabre)"

[dependencies]
libm.workspace = true
synth-core.workspace = true
gsm = { workspace = true, optional = true }
dls = { workspace = true, optional = true }

[[example]]
name = "render"
required-features = ["std"]

[features]
default = ["us-all"]
# host-side only: chunk encoder (task 1.4), requires std
std = []
# host-only read-only voice probe for the editor (change add-device-live-view): voice snapshots and filter taps
probe = ["std"]
# Multi-threaded rendering (change add-synth-threads): declares no render-time draws from the song random source.
threads = ["synth-core/threads"]

# --- instrument modules (a patch that uses a disabled module fails at load with UnsupportedModule) ---
us-osc-pm = []
us-osc-blit = []
us-osc-wt = []
us-osc-sample = []
us-sample-gsm = ["us-osc-sample", "dep:gsm"]
us-sample-dls = ["us-osc-sample", "dep:dls"]
# stereo DLS pairs (change add-gmplus-bank D6): a wave with a `stpr` partner plays left/right; without it the left
# wave plays mono, which is correct for any bank
us-sample-stereo = ["us-sample-dls"]
us-noise = []
us-flt-svf = []
us-flt-ladder = []
us-flt-rbj = []
us-flt-notch = []
us-env-seconds = []
us-env-rate = []
# optional voice paths (shrink-unified-synth 4.2): LFOs, glide/slide, mono-legato, unison > 1, one-shot
us-voice-lfo = []
us-voice-glide = []
us-voice-mono = []
us-voice-unison = []
us-voice-oneshot = []
# compo builds of songs generated by `synth-convert rust` (4.4): the song was loaded and checked on the host and the
# generated code asserts the build's modules at compile time, so chunk validation and the module load checks are left out.
# Never in a default build: invalid chunks then index out of range instead of failing with BadChunk.
us-trusted = []
# the mod matrix (4.3): without it no slot routes; target groups were measured and are not worth a feature
us-matrix = []
# naive oscillator generators, feedback-resonance and 4-pole filters, parallel filter routing, the voice drive stage,
# the frame-law envelope and LFO, the voice output settings, the channel strip (change add-v2-import; names:
# unify-v2-algorithms)
us-osc-naive = ["us-mono-sum"]
# the slot combine's multiply (ring) and replace (change unify-v2-algorithms: a setting of every slot)
us-osc-combine = []
# mini-cauldron oscillator (change add-cauldron-xm-import)
us-osc-clocked = []
us-flt-feedback = ["us-mono-sum"]
us-flt-parallel = ["us-mono-sum"]
us-drive = ["us-mono-sum"]
us-env-frame = ["us-mono-sum"]
us-lfo-frame = ["us-mono-sum"]
us-voice-out = ["us-mono-sum"]
# internal: the voice keeps the mono-sum slot and voice-stage state (`v2::Opt`) only with one of those features
us-mono-sum = []
us-strip = ["synth-core/pairs", "us-chunk-wide"]
# chunk escapes: an index of 240 or more (the channel strip's two-byte part) or 255 or more pairs
us-chunk-wide = []
# the formant speech stage (change add-v2-import): chunk version 2 text section and the speech synthesizer
us-speech = []
# quirks (change unify-v2-algorithms D2, 6.3 survey): behaviour that reproduces particular source builds, one module each
us-quirk-exact-math = []
us-quirk-integer-fm = []
us-quirk-fixed-seed = []
us-quirk-lcg-noise = []
us-quirk-coarse-env = []
us-quirk = ["us-quirk-exact-math", "us-quirk-integer-fm", "us-quirk-fixed-seed", "us-quirk-lcg-noise", "us-quirk-coarse-env"]
# matrix extensions (change add-v2-import): the Add operation, the controller and centred-note sources, slots 11–16
us-matrix-add = ["us-matrix"]
# automation lanes (4.5): without it the mixer skips the automation walk and a song with lanes fails to load
us-automation = []
# quiet-track skip: the mixer skips a track's devices while it is silent (no voice, effect tails below −120 dBFS);
# the same output, faster for songs with many sparse tracks (the converted TBL songs: 1.6–2.4×). A speed option, not a
# module a song needs: off, the skip path compiles out (Device::quiet_skip)
us-quiet = []

# --- effect kinds and modes (kind = any of its modes) ---
us-fx-distortion = ["us-fx-distortion-shaper", "us-fx-distortion-curve", "us-fx-distortion-power", "us-fx-distortion-wrap"]
us-fx-distortion-shaper = []
us-fx-distortion-power = []
us-fx-distortion-curve = []
# mini-cauldron wrap-around (change add-cauldron-xm-import)
us-fx-distortion-wrap = []
us-fx-crusher = []
us-fx-eq = ["us-fx-eq-parametric", "us-fx-eq-3band", "us-fx-eq-cut"]
us-fx-eq-cut = []
us-fx-eq-parametric = []
us-fx-eq-3band = []
us-fx-delay = ["us-fx-delay-tempo", "us-fx-delay-ms", "us-fx-delay-modulated"]
us-fx-delay-modulated = []
us-fx-delay-tempo = []
us-fx-delay-ms = []
us-fx-chorus = []
us-fx-flanger = ["us-fx-flanger-phaser", "us-fx-flanger-ring", "us-fx-flanger-comb"]
us-fx-flanger-phaser = []
us-fx-flanger-ring = []
# mini-cauldron comb and doubler (change add-cauldron-xm-import)
us-fx-flanger-comb = []
us-fx-reverb = ["us-fx-reverb-freeverb", "us-fx-reverb-compact", "us-fx-reverb-rooms", "us-fx-reverb-comb"]
us-fx-reverb-comb = []
us-fx-reverb-freeverb = []
us-fx-reverb-compact = []
us-fx-reverb-rooms = []
us-fx-compressor = []
us-fx-compressor-lookahead = []
us-fx-formant = []

us-osc = ["us-osc-pm", "us-osc-blit", "us-osc-wt", "us-osc-sample", "us-sample-gsm", "us-sample-dls", "us-osc-naive", "us-osc-clocked", "us-osc-combine"]
us-flt = ["us-flt-svf", "us-flt-ladder", "us-flt-rbj", "us-flt-notch", "us-flt-feedback", "us-flt-parallel"]
us-env = ["us-env-seconds", "us-env-rate", "us-env-frame"]
us-fx = ["us-fx-distortion", "us-fx-crusher", "us-fx-eq", "us-fx-delay", "us-fx-chorus", "us-fx-flanger",
         "us-fx-reverb", "us-fx-compressor", "us-fx-compressor-lookahead", "us-fx-formant"]
us-voice = ["us-voice-lfo", "us-voice-glide", "us-voice-mono", "us-voice-unison", "us-voice-oneshot", "us-drive", "us-lfo-frame", "us-voice-out"]
us-all = ["us-osc", "us-sample-stereo", "us-noise", "us-flt", "us-env", "us-voice", "us-matrix", "us-matrix-add", "us-quirk", "us-speech", "us-strip", "us-chunk-wide", "us-automation", "us-quiet", "us-fx"]
