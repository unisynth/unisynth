[package]
name = "wavesabre"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "no_std Rust port of the WaveSabre synth devices (Logicoma, MIT; see LICENSE-WaveSabre)"

[dependencies]
libm.workspace = true
synth-core.workspace = true
dls = { workspace = true, optional = true }

[features]
default = ["ws-all"]
ws-all = ["ws-falcon", "ws-slaughter", "ws-thunder", "ws-scissor", "ws-leveller", "ws-crusher", "ws-echo",
          "ws-smasher", "ws-chamber", "ws-twister", "ws-cathedral", "ws-adultery", "ws-specimen"]
ws-falcon = []
ws-slaughter = []
ws-thunder = []
ws-scissor = []
ws-leveller = []
ws-crusher = []
ws-echo = []
ws-smasher = []
ws-chamber = []
ws-twister = []
ws-cathedral = []
ws-adultery = ["dep:dls"]
ws-specimen = []

[dev-dependencies]
synth-core.workspace = true
