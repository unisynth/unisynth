<!doctype html>
<html lang="en">
<head><meta name="daw-static" content="1">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>64k DAW</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css?v=8ddc763308">

</head>
<body>
<header aria-label="Transport"><!-- rendered by ui/transport/TransportBar.tsx --></header>

<main>
  <nav id="browser" aria-label="Music browser">
    <section><!-- rendered by ui/files/Files.tsx --></section>
    <section id="lib" aria-label="Instrument library"><!-- rendered by ui/library/Library.tsx --></section>
  </nav>
  <div class="splitter" id="split-v" role="separator" aria-orientation="vertical" aria-label="Resize browser" tabindex="0"></div>

  <div id="work">
    <section id="arr" aria-label="Arrangement">
      <div id="arr-corner"><button title="Add track" aria-label="Add track">+</button><span class="sep"></span><button data-arr="cut" title="Cut (Ctrl+X)">Cut</button><button data-arr="copy" title="Copy (Ctrl+C)">Copy</button><button data-arr="paste" title="Paste at the cursor (Ctrl+V; Ctrl+Shift+V linked)">Paste</button><button data-arr="align" title="Align clip starts to the snap grid (Q)">Align</button></div>
      <div id="ruler-wrap"><div id="ruler" aria-label="Ruler. Top strip: drag the loop, its edges, or empty strip for a new loop. Below: click or drag to seek."></div></div>
      <div id="hdrs" aria-label="Track headers"></div>
      <div id="lanes-wrap" tabindex="0" aria-label="Arrangement clips. Click selects, drag moves (also to another track), right edge resizes, drag on empty space selects a range."><div id="lanes"></div></div>
    </section>
    <div class="splitter" id="split-h" role="separator" aria-orientation="horizontal" aria-label="Resize arrangement" tabindex="0"></div>

    <section id="bottom" aria-label="Editor panel">
      <div id="tabs" role="tablist">
        <button role="tab" id="tab-roll" aria-controls="p-roll" aria-selected="false">Piano roll</button>
        <button role="tab" id="tab-dev" aria-controls="p-dev" aria-selected="true">Device</button>
        <button role="tab" id="tab-mix" aria-controls="p-mix" aria-selected="false">Mixer</button>
        <div class="ctx" id="ctx"></div>
      </div>

      <div class="tabpanel" id="p-roll" role="tabpanel" aria-labelledby="tab-roll" hidden><!-- ui/roll/Roll.tsx, mounted while shown --></div>

      <div class="tabpanel" id="p-dev" role="tabpanel" aria-labelledby="tab-dev">
        <div id="device"></div>
      </div>

      <div class="tabpanel" id="p-mix" role="tabpanel" aria-labelledby="tab-mix" hidden>
        <div id="mixer"></div>
      </div>
    </section>
  </div>
</main>

<div id="live" class="sr" aria-live="polite"></div>
<footer>
  <span class="num">44.1 kHz · kinds 64, 66, 72</span>
  <span id="saved-info">Saved 2 min ago · 1 unsaved change</span>
  <span id="edit-status" class="num" aria-live="polite"></span>
  <span id="armed-info">Armed: <b>Bass</b> · octave C3 · vel 100</span>
  <button id="kb-btn" aria-pressed="true" title="Computer keyboard plays the selected track like a tracker: Z–M and Q–P are notes, [ ] octave, ; ' velocity (`). Off: letters are shortcuts again">⌨</button>
  <button id="midi-info" title="Connect Web MIDI input to the armed track">MIDI: connect</button>
  <span class="wheels" aria-label="Audition controllers"><label>MW <input id="mw" type="range" min="0" max="127" value="0" aria-label="Mod wheel (audition)"></label><label>PB <input id="pb" type="range" min="-8192" max="8191" value="0" aria-label="Pitch bend (audition, springs back)"></label></span>
  <span><kbd>Ctrl+X/C/V</kbd> cut/copy/paste <kbd>Ctrl+Q</kbd> quantize/align <kbd>↑↓</kbd> transpose/track <kbd>Space</kbd> play <kbd>Z</kbd>–<kbd>M</kbd> <kbd>Q</kbd>–<kbd>P</kbd> notes <kbd>[</kbd><kbd>]</kbd> octave <kbd>Shift+R</kbd> record <kbd>Ctrl+D</kbd> duplicate <kbd>Ctrl+Shift+D</kbd> linked copy</span>
</footer>
<!-- A sandboxed frame (e.g. the pi-dashboard canvas: opaque origin) cannot load the module or reach /api/music. -->
<script type="module" src="main.js?v=ea0731fd69" onerror="dawBlocked()"></script>
<script>
function dawBlocked() {
  var d = document.createElement("div");
  d.setAttribute("role", "alert");
  d.style.cssText = "position:fixed;inset:0;z-index:99;display:grid;place-items:center;background:#0b0e13ee;color:#e6e9ef;font:15px system-ui;text-align:center;padding:24px";
  d.innerHTML = "<div><b>The DAW could not start here.</b><br><br>This frame is sandboxed, so the browser blocks the engine and the song files.<br>Open <a style=\"color:#7ab4ff\" target=\"_blank\" href=\"" + location.href + "\">" + location.href + "</a> in a browser tab.</div>";
  document.body.appendChild(d);
}
</script>
</body>
</html>
